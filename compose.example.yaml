services:
  cdsg:
    image: ghcr.io/cloverstd/cloud-dynamic-security-group:latest
    pull_policy: always
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    command: [run, --config, /config/config.yaml]
